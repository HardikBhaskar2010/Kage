[package]
name = "kage-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Tauri 2.x native host process — CEF lifecycle, Win32 window, typed IPC handlers"

[lib]
name = "kage_host_lib"
crate-type = ["staticlib", "rlib"]
test = false

[dependencies]
kage-core    = { path = "../crates/kage-core" }
kage-storage = { path = "../crates/kage-storage" }
kage-context = { path = "../crates/kage-context" }
kage-cdp     = { path = "../crates/kage-cdp" }
kage-engine  = { path = "../crates/kage-engine" }
kage-browser = { path = "../crates/kage-browser" }

tauri        = { version = "2", features = ["devtools"] }
tokio        = { version = "1", features = ["full"] }
tokio-util   = { version = "0.7" }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
uuid         = { version = "1", features = ["v4"] }
thiserror    = "2.0"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
tauri-build  = { version = "2", features = [] }
