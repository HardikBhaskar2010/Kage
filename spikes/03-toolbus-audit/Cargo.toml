[package]
name = "kage-spike-toolbus-audit"
version = "0.2.1"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.10"
thiserror = "2.0"
async-trait = "0.1"
tokio-util = "0.7"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
