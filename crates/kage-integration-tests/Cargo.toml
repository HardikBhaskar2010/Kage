[package]
name = "kage-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "End-to-end governance, concurrency, and architecture contract integration tests for KAGE"

[dependencies]
kage-core   = { path = "../kage-core" }
kage-storage = { path = "../kage-storage" }
kage-engine  = { path = "../kage-engine" }
kage-browser = { path = "../kage-browser" }
tokio       = { version = "1", features = ["full"] }
tokio-util  = { version = "0.7" }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
async-trait = "0.1"
uuid        = { version = "1.10", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }
rusqlite    = { version = "0.32", features = ["bundled"] }
tempfile    = "3"
